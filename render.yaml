databases:
  - name: portagov-db
    plan: free   # Render free Postgres expires after 30 days; move to Neon/Supabase for longer use

services:
  - type: web
    name: portagov-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dev_server:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: portagov-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false   # the Vercel frontend URL, e.g. https://portagov.giin.co.rw
      - key: EXPOSE_OTP
        value: "True" # demo only: codes are still shown on screen. Set False once every
        # account that signs in has an email or a working SMS route; the admin
        # account currently has no email, so flipping it now would lock him out.
      - key: SMTP_HOST
        sync: false   # mail server from the ServerByt panel, e.g. mail.giin.co.rw
      - key: SMTP_PORT
        sync: false   # 465 for SSL, 587 for STARTTLS
      - key: SMTP_USER
        sync: false   # noreply@portagov.giin.co.rw
      - key: SMTP_PASS
        sync: false   # the mailbox password, set in the Render dashboard only
      - key: MAIL_FROM
        sync: false   # noreply@portagov.giin.co.rw
      - key: DEMO_MODE
        value: "False" # public demo accounts are disabled; the platform's own super admin is in place.
      - key: TASKS_SECRET
        generateValue: true # copy it into the backend repository's GitHub secrets for the daily job
